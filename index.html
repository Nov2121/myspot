<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイスポット</title>
<meta name="theme-color" content="#1f8a7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイスポット">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* VOICE: 自分だけの「行きたいお店」帳。気軽で、すっきり
   IDEA: 地図に貼る付箋（ひし形のスポット）とお店リスト
   PICTURE: 画面いっぱいの地図。登録したお店がアイコンで並ぶ
   COLOUR and TYPE: 白×墨色、スポットは深い緑。テーマで切替
   LAYOUT: PCは左にリスト、スマホは地図＋下から引き出すパネル */
:root{--bg:#fff;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#eceef1;--surf:#f5f6f8;--soft:#eef7f5;--acc:#1f8a7a;--acc-d:#145f54;--want:#1f8a7a;--went:#8a8f94;--route:#1f2328;--card:#fff;--peek:64px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans JP",system-ui,sans-serif;display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:100%}
button{font:inherit;color:inherit}
aside{background:var(--panel);display:flex;flex-direction:column;overflow:hidden;box-shadow:1px 0 0 var(--line),6px 0 20px rgba(0,0,0,.04);z-index:5;height:100vh}
.grab{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 20px 12px}
h1{margin:0;font:700 19px/1.3 "Noto Sans JP",sans-serif;letter-spacing:.03em}
.head p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.total{display:flex;align-items:baseline;gap:4px;flex:none}.total b{font:800 32px/1 Archivo,sans-serif}.total span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;margin:0 16px 4px;padding:4px;background:var(--surf);border-radius:12px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:9px;min-height:40px;font-weight:500;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cnt{display:none;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font:700 11px Archivo,sans-serif;padding:0 6px}.cnt:not(:empty){display:inline-grid}
.panes{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 28px}
.pane{display:none}.pane.on{display:block}
.ph{font-size:12px;color:var(--mute);font-weight:700;margin:18px 0 8px}
.note{font-size:13px;color:var(--mute);margin:6px 0;line-height:1.6}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surf);font-size:14px;cursor:pointer;padding:6px 12px;text-decoration:none;color:var(--ink)}
.btn.line{background:var(--card);border-color:#d9dce1}.btn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.row2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.row2>*{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chips button{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;cursor:pointer;color:var(--chip,#4b5563);white-space:nowrap}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chips button span{font:700 11px Archivo,sans-serif;opacity:.7}
.seg{display:inline-flex;background:var(--surf);border-radius:10px;padding:3px;margin:4px 0}
.seg button{border:0;background:none;border-radius:8px;min-height:32px;padding:0 12px;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{list-style:none;margin:8px 0;padding:0}
.list li button{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 2px;cursor:pointer;min-height:56px}
.list li button:hover{background:var(--surf)}
.list .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:18px}
.list b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;border:1.5px solid var(--want);color:var(--want);background:transparent}.tag.went{background:var(--went);border-color:var(--went);color:#fff}
.empty{background:var(--surf);border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.8}
.empty b{display:block;font-size:15px;margin-bottom:4px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-top:12px}
.form .lbl{font-size:13px;color:var(--mute);margin-top:12px}
.form input,.form textarea,.form select,select.sel{font:16px "Noto Sans JP",sans-serif;border:1px solid #d9dce1;border-radius:10px;padding:8px 10px;min-height:44px;background:var(--card);color:var(--ink);width:100%}
.where{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}.where b{flex:1;min-width:0}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:13px;cursor:pointer;min-height:32px}
.results{list-style:none;margin:6px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;font-size:14px;cursor:pointer;min-height:44px}.results li:first-child button{border-top:0}
.results button:hover{background:var(--surf)}
.rl{list-style:none;margin:8px 0;padding:0}
.rl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font:800 12px Archivo,sans-serif}
.rt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{grid-column:2;display:flex;gap:4px}
.rb button,.rb a{display:grid;place-items:center;min-width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);padding:0 8px}
.rb a{color:var(--acc);font-weight:700;border-color:#cfe6e1}
.info{font-size:12px;color:var(--mute);background:var(--surf);border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.6}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themes button{display:grid;gap:5px;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:10px;cursor:pointer;min-height:44px}
.themes button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.themes .tn{font-size:13px;font-weight:700}.themes .td{font-size:11px;color:var(--mute);line-height:1.4}
.themes .sw3{display:flex;gap:4px}.themes .sw3 i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.catedit{list-style:none;margin:6px 0;padding:0}.catedit li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.catedit li span{flex:1}
.catedit button{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px;min-height:32px}
.emojis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.emojis button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:18px;cursor:pointer}.emojis button.on{border-color:var(--acc);background:var(--soft)}
#map{height:100%;background:#e8e6e1}
/* 検索 */
.srch{width:380px;max-width:calc(100vw - 80px)}
.sbox{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:12px;padding:0 4px 0 14px;box-shadow:0 2px 12px rgba(0,0,0,.16)}
.sbox svg{width:18px;height:18px;flex:none;color:var(--mute)}
.sbox input{flex:1;border:0;outline:0;font:16px "Noto Sans JP",sans-serif;padding:10px 0;min-height:44px;background:none;color:var(--ink)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox button{border:0;background:none;font-size:22px;width:40px;height:40px;cursor:pointer;color:var(--mute);visibility:hidden}
.sres{display:none;background:var(--panel);border-radius:12px;margin-top:6px;max-height:min(380px,55vh);overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.sres.show{display:block}
.sgh{padding:8px 14px 4px;font-size:11px;font-weight:700;color:var(--mute)}
.hit{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer;min-height:48px}
.hit b{display:block;font-size:14px}.hit small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .hi{font-size:16px;text-align:center;color:var(--mute)}
.hit .add{font-size:12px;font-weight:700;color:var(--acc);white-space:nowrap}
.hit.act,.hit:hover{background:var(--surf)}
.none{padding:10px 14px;font-size:13px;color:var(--mute)}
/* スポットのピン */
.spin{width:38px;height:48px;position:relative;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.spin>svg{position:absolute;left:0;top:0;width:38px;height:48px}
.spin>svg path{fill:var(--want)}.spin.went>svg path{fill:var(--went)}.spin.sel>svg path{fill:var(--acc-d)}
.spin span{position:absolute;left:8px;top:7px;width:22px;height:22px;display:grid;place-items:center;font-size:13px;line-height:1;border-radius:50%;background:#fff}
.spin b{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--route);color:#fff;font:800 11px/16px Archivo,sans-serif;text-align:center;border:2px solid #fff;padding:0 4px}
.spin i{position:absolute;left:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--went);color:#fff;font:700 10px/14px sans-serif;text-align:center;font-style:normal;border:2px solid #fff}
.spin.sel{transform:scale(1.18);transform-origin:50% 100%}
.cic{flex:none;width:52px;height:52px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.seg button.on[data-c="want"],.seg button.on[data-fs="want"],.seg button.on[data-st="want"]{background:var(--want);color:#fff}
.seg button.on[data-c="went"],.seg button.on[data-fs="went"],.seg button.on[data-st="went"]{background:var(--went);color:#fff}
.pinlbl{background:#fff;border:0;border-radius:6px;font:700 12px "Noto Sans JP";padding:2px 8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}.pinlbl:before{display:none}
.tmp{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 0 0 3px rgba(0,0,0,.15)}
/* 詳細カード */
#card{position:fixed;top:64px;right:16px;width:360px;z-index:1100;background:var(--panel);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.18);display:none;max-height:calc(100vh - 90px);overflow:auto}
#card.show{display:block}
.ch{display:flex;gap:8px;align-items:flex-start;padding:16px 14px 8px}
.ch h3{margin:0;font-size:19px;line-height:1.35;flex:1}.ch h3 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:2px}
.x{border:0;background:none;font-size:26px;line-height:1;width:44px;height:44px;margin:-10px -8px 0 0;cursor:pointer;color:var(--mute)}
#card dl{margin:0;padding:6px 14px;display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:6px 10px;font-size:14px}
#card dt{color:var(--mute)}#card dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
#card dd a{color:var(--acc)}
.sec{padding:10px 14px;border-top:1px solid var(--line)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts>*{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #d9dce1;border-radius:10px;background:var(--card);font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;padding:4px 6px}
.acts .pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.acts .wide{grid-column:1/-1}
/* その他 */
.legend{background:var(--panel);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:8px 12px;font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;transform:rotate(45deg);margin-right:6px;vertical-align:-1px}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-10px);opacity:0;z-index:3000;background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;transition:all .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#pickbar{position:fixed;left:50%;bottom:calc(var(--peek) + 16px);transform:translateX(-50%);width:min(460px,calc(100vw - 24px));z-index:2500;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--acc);color:#fff;padding:10px 10px 10px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:14px}
#pickbar.show{display:flex}#pickbar button{border:0;background:#fff;color:var(--acc);font-weight:700;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer}
#map.picking{cursor:crosshair}
.fab{display:none}
.leaflet-bar{border:0!important;border-radius:10px!important;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)!important}
.leaflet-control-layers{border:0!important;border-radius:10px!important;box-shadow:0 2px 10px rgba(0,0,0,.15)!important}
/* スマホ */
@media(max-width:760px){
 body{display:block;height:100dvh;overflow:hidden}
 #map{position:fixed;inset:0;height:auto}
 aside{position:fixed;left:0;right:0;bottom:0;z-index:1000;border-radius:18px 18px 0 0;height:80dvh;transform:translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom)));transition:transform .25s ease;box-shadow:0 -2px 14px rgba(0,0,0,.18)}
 aside.open{transform:none}
 .grab{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;border:0;background:none;padding:8px 16px 10px;font-size:15px;cursor:pointer;min-height:var(--peek);flex:none}
 .grab:before{content:"";width:40px;height:5px;border-radius:3px;background:#c8c8c8}
 .grab b{font:800 20px Archivo,sans-serif;margin-right:2px}.grab .gs{color:var(--mute);font-size:13px}
 .head{display:none}
 .panes{padding:6px 16px calc(24px + env(safe-area-inset-bottom))}
 .srch{width:calc(100vw - 20px);max-width:none}
 .sbox{border-radius:26px}
 .leaflet-control-zoom,.leaflet-control-layers{display:none}
 .leaflet-bottom{bottom:calc(var(--peek) + env(safe-area-inset-bottom))}
 .fab{display:grid;place-items:center;position:fixed;right:12px;z-index:900;width:50px;height:50px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}
 .fab svg{width:24px;height:24px}
 #fabAdd{bottom:calc(var(--peek) + 22px + env(safe-area-inset-bottom));width:58px;height:58px;background:var(--acc);color:#fff}
 #fabLoc{bottom:calc(var(--peek) + 92px + env(safe-area-inset-bottom))}
 .fab[hidden]{display:none!important}
 #card{top:auto;right:0;left:0;width:auto;bottom:0;border-radius:18px 18px 0 0;max-height:65dvh;padding-bottom:env(safe-area-inset-bottom);z-index:1150;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
 .ch{position:relative;padding-top:18px}.ch:before{content:"";position:absolute;left:50%;top:6px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#c8c8c8}
 .legend{font-size:11px;padding:6px 8px}
}
@media(prefers-reduced-motion:reduce){aside,#toast{transition:none}}

/* ===== デザインテーマ（案A・B・C） ===== */
/* 案A：アメリカン・ヴィンテージ古着屋 */
:root[data-ui="vintage"]{--bg:#ece0cc;--panel:#f7efe2;--ink:#2e2a28;--mute:#76685b;--line:#e3d5bf;--surf:#efe4d1;--soft:#f2e3d4;--acc:#c94b43;--acc-d:#962f29;--want:#c94b43;--went:#355c7d;--route:#1f2e45}
:root[data-ui="vintage"] body{font-family:"Noto Sans JP",sans-serif}
:root[data-ui="vintage"] h1,:root[data-ui="vintage"] .ch h3,:root[data-ui="vintage"] .total b,:root[data-ui="vintage"] .grab b,:root[data-ui="vintage"] .empty b{font-family:"M PLUS 1p","Noto Sans JP",sans-serif!important;font-weight:800!important}
:root[data-ui="vintage"] h1:before{content:"★";color:var(--acc);margin-right:6px}
:root[data-ui="vintage"] .total b{color:var(--acc)}
:root[data-ui="vintage"] .leaflet-tile-pane{filter:sepia(.28) saturate(.9) contrast(.97)}
/* デニム生地（綾織り）＋オレンジのステッチ */
:root[data-ui="vintage"]{--denim:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(25deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px),linear-gradient(180deg,#3d5f86,#2b4767);--stitch:#e3a04a}
:root[data-ui="vintage"] .head{background:var(--denim);margin:0 0 12px;padding:22px 20px 16px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
:root[data-ui="vintage"] .head:after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--stitch);border-radius:4px;pointer-events:none;opacity:.9}
:root[data-ui="vintage"] .head h1{color:#f7efe2}:root[data-ui="vintage"] .head p{color:#cfd9e4}
:root[data-ui="vintage"] h1:before{color:var(--stitch)}
:root[data-ui="vintage"] .total{background:#8a5a34;background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.3px);background-size:4px 4px;border-radius:5px;padding:6px 10px;box-shadow:inset 0 0 0 1.5px #6d4426,0 2px 0 rgba(0,0,0,.25);transform:rotate(-2deg)}
:root[data-ui="vintage"] .total b,:root[data-ui="vintage"] .total span{color:#f7e6cc!important}
:root[data-ui="vintage"] .tag.went,:root[data-ui="vintage"] .seg button.on[data-c="went"],:root[data-ui="vintage"] .seg button.on[data-fs="went"],:root[data-ui="vintage"] .seg button.on[data-st="went"]{background:var(--denim);border-color:#2b4767;box-shadow:inset 0 0 0 1px #2b4767,inset 0 0 0 2.5px transparent;outline:1px dashed var(--stitch);outline-offset:-3px}
:root[data-ui="vintage"] #card{background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px) top/100% 12px no-repeat,repeating-linear-gradient(25deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px) top/100% 12px no-repeat,linear-gradient(#3d5f86,#2b4767) top/100% 12px no-repeat,var(--panel);padding-top:12px}
:root[data-ui="vintage"] #card:before{content:"";display:block;height:0;border-top:1.5px dashed var(--stitch);margin:-6px 8px 5px}
:root[data-ui="vintage"] #fabAdd{background:var(--denim);box-shadow:0 0 0 2px #2b4767}
:root[data-ui="vintage"] .tabs{background:none;border-radius:0;padding:0;border-bottom:2px solid var(--ink)}

<div id="toast" role="status"></div>
<div id="pickbar" role="status"><span>登録する場所を地図でタップ</span><button id="pickcancel">やめる</button></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
{
// ---------- 基本 ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=t=>String(t||"").normalize("NFKC").toLowerCase().replace(/[\s　]/g,"");
const isMobile=()=>window.matchMedia("(max-width:760px)").matches;
const KEY="mySpotMap.v1";
const DEFAULT_CATS=[["古着屋","👕"],["カフェ","☕"],["雑貨・インテリア","🪴"],["本屋","📚"],["レコード・音楽","💿"],["飲食","🍴"],["美容","✂"],["その他","★"]];
const EMOJIS=["👕","👟","👜","🧢","💍","☕","🍰","🍴","🍺","📚","💿","🎸","🪴","🕯","🖼","✂","💈","🧴","🎨","📷","🛹","🏷","★","❤"];
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");return {spots:d.spots||[],cats:d.cats||DEFAULT_CATS,route:d.route||[],ui:d.ui||"",mode:d.mode||"driving",packs:d.packs||{},wx:d.wx!==false,wxfx:d.wxfx!==false}}catch(e){return {spots:[],cats:DEFAULT_CATS,route:[],ui:"",mode:"driving",packs:{},wx:true,wxfx:true}}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("この端末に保存できませんでした（ブラウザの設定を確認してください）")}}
const WM=()=>S.ui==="vintage"?"⚑":"♡";
const ICONS={"👕":[["M8 3L4 5.5 2.5 9.5 5.5 11 6.5 9.5V21H17.5V9.5L18.5 11 21.5 9.5 20 5.5 16 3C15 4.8 13.6 5.5 12 5.5S9 4.8 8 3Z","f"],["M10 3.9C10.6 4.9 11.3 5.5 12 5.5",""]],"👟":[["M2.5 17V11.5C2.5 10 3.5 8.5 5 8.5L8 9C9 10.5 10.5 11 12 11L14.5 12C17 12.8 21.5 13.5 21.5 16V17Z","f"],["M2.5 17H21.5V19.5H2.5Z","f2"],["M8.6 9.6L9.6 7.8M10.8 10.6L11.8 8.8",""]],"👜":[["M4 9H20L19 20.5H5Z","f"],["M8.5 9V7A3.5 3.5 0 0 1 15.5 7V9",""],["M10 12.5H14",""]],"🧢":[["M3.5 15C3.5 9 7 5.5 12 5.5S20.5 9 20.5 15Z","f"],["M12 15H22C22 16.8 20 17.5 17 17.5H12Z","f2"],["M12 5.5V4.3M12 5.5C10 8 9.5 11.5 9.5 15",""]],"💍":[["M5.5 14.5A6.5 6.5 0 1 0 18.5 14.5A6.5 6.5 0 1 0 5.5 14.5",""],["M9 3.5H15L17 6L12 9.5L7 6Z","f2"]],"☕":[["M4 9H17V14A5 5 0 0 1 12 19H9A5 5 0 0 1 4 14Z","f"],["M17 11H18.5A2.5 2.5 0 0 1 18.5 16H16.6",""],["M8.5 3.3C7.5 4.5 9.5 5.5 8.5 6.8M12.5 3.3C11.5 4.5 13.5 5.5 12.5 6.8M3 21.5H19",""]],"🍰":[["M3 19.5V12.5L20 8.5V19.5Z","f"],["M3 12.5L20 8.5V11.8L3 15.8Z","w"],["M15 4.3C13.5 4.3 13 5.9 13 6.7L15 7.9L17 6.7C17 5.9 16.5 4.3 15 4.3Z","f2"]],"🍴":[["M6 3V9A2.5 2.5 0 0 0 11 9V3M8.5 3V21",""],["M17 3C14.8 5 14.3 9 15 13H17Z","f"],["M17 3V21",""]],"🍺":[["M5 7H16V20A1 1 0 0 1 15 21H6A1 1 0 0 1 5 20Z","f"],["M4.5 7.5A2.5 2.5 0 0 1 7.5 4.3A3 3 0 0 1 12.5 4.3A2.5 2.5 0 0 1 16.5 7.5Z","w"],["M16 10H18.5A1.5 1.5 0 0 1 20 11.5V15A1.5 1.5 0 0 1 18.5 16.5H16M8.5 11V17.5M12 11V17.5",""]],"📚":[["M4 4H8V20H4Z","f"],["M8 6.5H12V20H8Z","f2"],["M13 5.6L16.5 4.6L20.5 19.2L17 20.2Z","f"],["M3 20.5H21",""]],"💿":[["M2.5 12A9.5 9.5 0 1 0 21.5 12A9.5 9.5 0 1 0 2.5 12","f"],["M8.8 12A3.2 3.2 0 1 0 15.2 12A3.2 3.2 0 1 0 8.8 12","f2"],["M11.2 12A.8.8 0 1 0 12.8 12A.8.8 0 1 0 11.2 12M6.3 9.3A6 6 0 0 1 9.3 6.3","w"]],"🎸":[["M9.5 11C7 10 4.5 11 3.7 13.6C3 16 5 16.6 4.6 18.4C4.3 20 6.5 21.2 8 20C9.5 18.8 10.5 19.5 12 18.8C14.3 17.7 14.5 14.8 13 12.8Z","f"],["M7.6 15.6A1.4 1.4 0 1 0 10.4 15.6A1.4 1.4 0 1 0 7.6 15.6","w"],["M11.3 12.7L19.5 4.5M18.6 3.3L20.7 5.4",""]],"🪴":[["M7 14H17L15.8 21H8.2Z","f"],["M12 11.5C8.5 11.5 6.5 9 6.5 5.8C10 5.8 12 8 12 11.5Z","f2"],["M12 10C12 6.5 14 3.8 17.5 3.8C17.5 7.3 15.5 10 12 10Z","f2"],["M12 14V9.5",""]],"🕯":[["M8.5 10H15.5V20.5H8.5Z","f"],["M12 2.8C13.8 4.8 14 6.2 14 7A2 2 0 0 1 10 7C10 6.2 10.2 4.8 12 2.8Z","f2"],["M6 20.5H18M12 9V10",""]],"🖼":[["M3.5 4.5H20.5V19.5H3.5Z","f"],["M6.5 7.5H17.5V16.5H6.5Z","w"],["M6.5 16.5L10.5 11.5L13 14L14.5 12.5L17.5 16.5",""],["M13.5 9.8A1 1 0 1 0 15.5 9.8A1 1 0 1 0 13.5 9.8","f2"]],"✂":[["M8.8 15.6L18 3.5M15.2 15.6L6 3.5",""],["M3.8 17.8A2.8 2.8 0 1 0 9.4 17.8A2.8 2.8 0 1 0 3.8 17.8","f"],["M14.6 17.8A2.8 2.8 0 1 0 20.2 17.8A2.8 2.8 0 1 0 14.6 17.8","f"]],"💈":[["M8 5H16V19H8Z","w"],["M8 8.5L16 5.5V8L8 11ZM8 14L16 11V13.5L8 16.5Z","f"],["M7 3H17V5H7ZM7 19H17V21H7Z","f2"]],"🧴":[["M7 10A2 2 0 0 1 9 8H15A2 2 0 0 1 17 10V20A1 1 0 0 1 16 21H8A1 1 0 0 1 7 20Z","f"],["M10 8V5.5H14V8M9.5 3H15.5M12 3V5.5",""],["M9.5 12.5H14.5V17H9.5Z","w"]],"🎨":[["M12 3C6.5 3 2.5 7 2.5 12S6.5 21 11.5 21C13 21 13.5 20 13 18.8C12.4 17.4 13.3 16 15 16H17.5C19.8 16 21.5 14.3 21.5 12C21.5 7 17.2 3 12 3Z","f"],["M6.2 11.5A1.3 1.3 0 1 0 8.8 11.5A1.3 1.3 0 1 0 6.2 11.5M8.7 7.3A1.3 1.3 0 1 0 11.3 7.3A1.3 1.3 0 1 0 8.7 7.3M13.4 6.8A1.3 1.3 0 1 0 16 6.8A1.3 1.3 0 1 0 13.4 6.8M16.4 10.6A1.3 1.3 0 1 0 19 10.6A1.3 1.3 0 1 0 16.4 10.6","f2"]],"📷":[["M3 8H7.5L9 5.5H15L16.5 8H21V19H3Z","f"],["M8.5 13.2A3.5 3.5 0 1 0 15.5 13.2A3.5 3.5 0 1 0 8.5 13.2","w"],["M10.6 13.2A1.4 1.4 0 1 0 13.4 13.2A1.4 1.4 0 1 0 10.6 13.2","f2"],["M5 10.5H6.5",""]],"🛹":[["M2.5 10C2.5 8.8 3.5 8.5 4.5 9.2C5.2 9.8 6 10 7 10H17C18 10 18.8 9.8 19.5 9.2C20.5 8.5 21.5 8.8 21.5 10C21.5 11.5 20 12.5 18 12.5H6C4 12.5 2.5 11.5 2.5 10Z","f"],["M7 12.5V14M17 12.5V14",""],["M5 16A2 2 0 1 0 9 16A2 2 0 1 0 5 16M15 16A2 2 0 1 0 19 16A2 2 0 1 0 15 16","f2"]],"🏷":[["M3 4.5V11L12.5 20.5L20.5 12.5L11 3H4.5A1.5 1.5 0 0 0 3 4.5Z","f"],["M6 7.5A1.5 1.5 0 1 0 9 7.5A1.5 1.5 0 1 0 6 7.5","w"]],"★":[["M12 2.8L14.8 8.6L21.2 9.4L16.5 13.8L17.7 20.2L12 17.1L6.3 20.2L7.5 13.8L2.8 9.4L9.2 8.6Z","f"]],"❤":[["M12 20.5C12 20.5 3 15 3 8.8A4.8 4.8 0 0 1 12 6.5A4.8 4.8 0 0 1 21 8.8C21 15 12 20.5 12 20.5Z","f"]]};
const icoSvg=e=>{const d=ICONS[e];return d?'<svg class="ci" viewBox="0 0 24 24" aria-hidden="true">'+d.map(p=>'<path d="'+p[0]+'"'+(p[1]?' class="'+p[1]+'"':'')+'/>').join("")+'</svg>':esc(e)};
const ico=e=>S.ui&&ICONS[e]?icoSvg(e):esc(e);
const catIcon=c=>ico((S.cats.find(x=>x[0]===c)||[0,"★"])[1]);
const byId=id=>S.spots.find(s=>s.id===id);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3200)}
const fmtKm=d=>d<1?Math.round(d*1000)+"m":d.toFixed(1)+"km";
const hv=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

// ---------- 地図 ----------
const map=L.map("map",{zoomSnap:1,minZoom:4,maxZoom:19,zoomControl:false}).setView([34.69,135.50],12);
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const gsi=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'});
// ファイルを直接開いた場合（file://）はOpenStreetMapが「Access blocked」画像を返すため、最初から国土地理院の地図を使う
const LOCALFILE=location.protocol==="file:"||location.origin==="null";
(LOCALFILE?gsi:osm).addTo(map);
// OpenStreetMapが読み込めないときは国土地理院の地図に自動で切り替える
let tileErr=0;osm.on&&osm.on("tileerror",()=>{if(++tileErr===6&&map.hasLayer(osm)){map.removeLayer(osm);gsi.addTo(map);toast("地図を国土地理院の地図に切り替えました")}});
if(!LOCALFILE)L.control.layers({"OpenStreetMap":osm,"国土地理院":gsi},null,{position:"topright"}).addTo(map);
map.createPane("spots").style.zIndex=630;
const layer=L.layerGroup().addTo(map);
const canHover=window.matchMedia&&matchMedia("(hover:hover)").matches;
let selId=null,tmpMk=null,filter={cat:"",st:""};
function visible(s){return (!filter.cat||s.cat===filter.cat)&&(!filter.st||(filter.st==="went"?s.went:!s.went))}
function drawMarkers(){
  layer.clearLayers();
  for(const s of S.spots){
    if(!visible(s))continue;
    const ri=S.route.indexOf(s.id);
    const html='<div class="spin'+(s.went?' went':'')+(s.id===selId?' sel':'')+'"><svg viewBox="0 0 38 48"><path d="M19 46C19 46 35 29.5 35 18A16 16 0 0 0 3 18C3 29.5 19 46 19 46Z" stroke="#fff" stroke-width="2.5"/></svg><span>'+catIcon(s.cat)+'</span>'+(ri>=0?'<b>'+(ri+1)+'</b>':'')+(s.went?'<i>✓</i>':'')+'</div>';
    const m=L.marker([s.lat,s.lng],{pane:"spots",icon:L.divIcon({html,className:"",iconSize:[38,48],iconAnchor:[19,46]}),title:s.name,riseOnHover:true});
    m.on("click",()=>openCard(s.id));
    if(canHover)m.bindTooltip(esc(s.name),{direction:"right",offset:[14,-22],className:"pinlbl"});
    m.addTo(layer);
  }
  drawLegend();
}
const legend=L.control({position:"bottomright"});legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.id="legend";return d};legend.addTo(map);
function drawLegend(){const el=$("legend");if(!el)return;if(!S.spots.length){el.style.display="none";return}el.style.display="";el.innerHTML='<div><i style="background:var(--want)"></i>'+WM()+' 行きたい</div><div><i style="background:var(--went)"></i>✓ 行った</div>'+(S.route.length?'<div><i style="background:var(--route);border-radius:50%"></i>数字＝巡る順番</div>':'')}
function fitAll(){const P=S.spots.filter(visible);if(P.length===1)map.setView([P[0].lat,P[0].lng],16);else if(P.length)map.fitBounds(L.latLngBounds(P.map(s=>[s.lat,s.lng])).pad(.2),{maxZoom:16})}

// ---------- タブ・パネル ----------
let sheetOpen=false;
function setTab(t){document.querySelectorAll(".tabs [data-tab]").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.pane===t));$("panes").scrollTop=0}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){setTab(b.dataset.tab);if(isMobile()&&!sheetOpen)setSheet(true)}});
function setSheet(o){sheetOpen=o;$("side").classList.toggle("open",o);$("grab").setAttribute("aria-expanded",o);if(o)closeCard();drawGrab()}
function drawGrab(){$("grab").innerHTML='<span><b>'+fmtN(S.spots.length)+'</b>件のスポット　<span class="gs">'+(sheetOpen?'▼ 地図にもどる':'▲ 一覧・設定')+'</span></span>'}
$("grab").addEventListener("click",()=>setSheet(!sheetOpen));
(()=>{let y0=null;const g=$("grab");g.addEventListener("touchstart",e=>{y0=e.touches[0].clientY},{passive:true});g.addEventListener("touchend",e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;if(dy<-40)setSheet(true);else if(dy>40)setSheet(false);y0=null},{passive:true})})();
function openPanel(tab){setTab(tab);if(isMobile())setSheet(true)}

// ---------- 一覧 ----------
let form=null,formPlace=null,formBusy=false,formQ="",picking=false;
const GEO_OK=!!(window.isSecureContext&&navigator.geolocation);
const NOMI="https://nominatim.openstreetmap.org/";
// OpenStreetMap（Nominatim）の住所を日本式の並びにする
function jpAddr(a){if(!a)return "";const k=["province","state","city","town","village","county","city_district","suburb","quarter","neighbourhood","hamlet","block_number","house_number"];const out=[];for(const x of k){const v=a[x];if(v&&!out.includes(v)&&!out.some(o=>o.includes(v)))out.push(v)}let t=out.join("");if(a.house_number&&/^\d/.test(a.house_number))t=t.replace(new RegExp(a.house_number+"$"),"-"+a.house_number).replace(/(丁目)-/,"$1");return t}
async function revGeo(lat,lng){try{const r=await fetch(NOMI+"reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=ja&lat="+lat+"&lon="+lng);const j=await r.json();return jpAddr(j.address)}catch(e){return ""}}
// 場所を決めたら住所を自動で入れる（分からなければ「地図で指定した場所」）
function setLoc(p,addr){const f=form;if(!f)return;f.lat=p.lat;f.lng=p.lng;f.addr=addr||"住所を調べています…";showTmp(p);if(!addr){revGeo(p.lat,p.lng).then(t=>{if(form===f&&f.lat===p.lat&&f.addr==="住所を調べています…"){f.addr=t||"地図で指定した場所";if(document.querySelector("#pList .where")){readForm();drawForm()}}})}}

function drawList(){
  $("tot").textContent=fmtN(S.spots.length);drawGrab();
  if(form)return drawForm();
  const used=S.cats.filter(c=>S.spots.some(s=>s.cat===c[0]));
  if(filter.cat&&!used.some(c=>c[0]===filter.cat))filter.cat="";
  const P=S.spots.filter(visible).slice().sort((a,b)=>(b.t||0)-(a.t||0));
  let h='<button class="bigbtn" data-a="new">＋ スポットを登録</button>';
  if(!S.spots.length){
    h+='<div class="empty"><b>まだスポットがありません</b>次のどれかで登録できます。<br>・上の「＋ スポットを登録」<br>・地図を長押し（パソコンは右クリック）<br>・検索欄で地名やお店の住所を探して「＋登録」<br><span class="note">登録した内容は、この端末の中だけに保存されます。</span></div>';
  }else{
    h+='<div class="chips"><button data-cat="" class="'+(filter.cat?'':'on')+'">すべて <span>'+S.spots.length+'</span></button>'+used.map(c=>'<button data-cat="'+esc(c[0])+'" class="'+(filter.cat===c[0]?'on':'')+'">'+ico(c[1])+' '+esc(c[0])+' <span>'+S.spots.filter(s=>s.cat===c[0]).length+'</span></button>').join("")+'</div>'
      +'<div class="seg" role="group" aria-label="行きたい・行った"><button data-st="" class="'+(filter.st?'':'on')+'">すべて</button><button data-st="want" class="'+(filter.st==="want"?'on':'')+'">'+WM()+' 行きたい</button><button data-st="went" class="'+(filter.st==="went"?'on':'')+'">✓ 行った</button></div>';
    h+=P.length?'<ul class="list">'+P.map(s=>'<li><button data-go="'+s.id+'"><span class="ic">'+catIcon(s.cat)+'</span><span><b>'+esc(s.name)+'</b><small>'+esc(s.cat)+(s.addr?'・'+esc(s.addr):'')+'</small></span><span class="tag'+(s.went?' went':'')+'">'+(s.went?'✓ 行った':WM()+' 行きたい')+'</span></button></li>').join("")+'</ul>':'<p class="note">条件に合うスポットはありません。</p>';
  }
  $("pList").innerHTML=h;
}
function drawForm(){
  const f=form;
  let h='<div class="form"><div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:16px">'+(f.id?'スポットを編集':'スポットを登録')+'</b><button class="link" data-a="cancel">やめる</button></div>'
   +'<label>名前<input data-f="name" value="'+esc(f.name)+'" placeholder="例）ヴィンテージ古着 ABC" autocomplete="off"></label>'
   +'<div class="lbl">カテゴリ</div><div class="chips">'+S.cats.map(c=>'<button data-fc="'+esc(c[0])+'" class="'+(f.cat===c[0]?'on':'')+'">'+ico(c[1])+' '+esc(c[0])+'</button>').join("")+'</div>'
   +'<div class="lbl">状態</div><div class="seg"><button data-fs="want" class="'+(f.went?'':'on')+'">'+WM()+' 行きたい</button><button data-fs="went" class="'+(f.went?'on':'')+'">✓ 行った</button></div>'
   +'<div class="lbl">場所</div>';
  if(f.lat!=null)h+='<div class="where"><b>'+esc(f.addr||"地図で指定した場所")+'</b><button class="link" data-a="replace">変更</button></div>';
  else h+=(GEO_OK?'<button class="btn here" data-a="here">📍 今いる場所で登録</button>':'')
   +'<div class="row2" style="margin-top:6px"><textarea data-f="q" rows="2" placeholder="Googleマップでコピーした住所を貼り付け" enterkeyhint="search" style="flex:3;resize:vertical">'+esc(formQ)+'</textarea><button class="btn line" data-a="search">探す</button></div>'
   +'<details class="howto"><summary>Googleマップで住所をコピーするには</summary><ol><li>Googleマップでお店を開く</li><li>お店の情報にある<b>住所の行を長押し</b>（Androidはタップでも可）</li><li>「コピー」された住所を、上の欄に貼り付け</li></ol><p>貼り付けると自動で場所が入ります。地名だけ（例：南船場4丁目）でも探せます。</p></details>'
   +(formBusy?'<p class="note">'+esc(formBusy===true?'検索中…':formBusy)+'</p>':formPlace==="err"?'<p class="note">検索できませんでした（インターネット接続を確認してください）。</p>':formPlace==="short"?'<p class="note warn">リンクからは場所を読み取れません。Googleマップで<b>住所の行を長押ししてコピー</b>し、住所を貼り付けてください。</p>':Array.isArray(formPlace)?(formPlace.length?'<ul class="results">'+formPlace.map((p,i)=>'<li><button data-pick="'+i+'"><b>'+esc(p.label)+'</b>'+(p.sub?'<small>'+esc(p.sub)+'</small>':'')+'</button></li>').join("")+'</ul>':'<p class="note">住所が見つかりませんでした。「〇〇市〇〇町」までに短くするか、地図で指定してください。</p>'):'')
   +'<div class="row2"><button class="btn line" data-a="mappick">地図をタップして指定</button><button class="btn line" data-a="center">今の地図の中心にする</button></div>';
  h+='<label>メモ（任意）<textarea data-f="memo" rows="3" placeholder="例）土日のみ営業、70sデニムが多い">'+esc(f.memo)+'</textarea></label>'
   +'<label>お店のURL・SNS（任意）<input data-f="url" value="'+esc(f.url)+'" placeholder="https://" inputmode="url"></label>'
   +'<div class="row2" style="margin-top:14px"><button class="bigbtn" data-a="save">保存</button></div></div>';
  $("pList").innerHTML=h;
}

// Googleマップからコピーした住所を整える（〒・「日本、」・全角数字・建物名など）
function cleanAddr(t){return String(t||"").normalize("NFKC").replace(/[−‐‑–—ー](?=\d)/g,"-").replace(/^\s*日本[、,]?\s*/,"").replace(/〒?\s*\d{3}-\d{4}\s*/,"").replace(/\s+/g," ").trim()}
async function gsiSearch(q){const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));const j=await r.json();return (j||[]).slice(0,8).map(f=>({label:f.properties.title,addr:f.properties.title,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}))}
async function placeSearch(q){
  q=cleanAddr(q);if(!q)return [];
  // 見つからなければ、建物名→番地の順に後ろを削って探し直す
  const tries=[q,q.replace(/\s.*$/,""),q.replace(/(\d+丁目|\d+番地?|\d+)[\d\-番地号の\s]*.*$/,"$1"),q.replace(/\d.*$/,"")].filter((x,i,a)=>x&&a.indexOf(x)===i);
  for(const t of tries){const r=await gsiSearch(t);if(r.length)return r}
  return [];
}

function routeSpots(){return S.route.map(byId).filter(Boolean)}
function nnFrom(start,rest){rest=rest.slice();const p=[];let cur=start;while(rest.length){let bi=0,bd=1e18;rest.forEach((x,i)=>{const d=hv(cur,x);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];p.push(cur)}return p}
function twoOpt(p){let imp=true,n=0;while(imp&&n++<50){imp=false;for(let i=1;i<p.length-1;i++)for(let j=i+1;j<p.length;j++){const a=p[i-1],b=p[i],c=p[j],d=p[j+1];const be=hv(a,b)+(d?hv(c,d):0),af=hv(a,c)+(d?hv(b,d):0);if(af<be-1e-9){p.splice(i,j-i+1,...p.slice(i,j+1).reverse());imp=true}}}return p}
const pathLen=p=>p.reduce((s,x,i)=>i?s+hv(p[i-1],x):0,0);
function optimize(){const P=routeSpots();if(P.length<3)return;let best=null,bl=1e18;for(const st of P){const p=twoOpt([st,...nnFrom(st,P.filter(x=>x!==st))]);const l=pathLen(p);if(l<bl){bl=l;best=p}}S.route=best.map(s=>s.id);save();drawAll()}
const ll=s=>s.lat.toFixed(6)+","+s.lng.toFixed(6);
function navUrl(dest,via,origin){let u="https://www.google.com/maps/dir/?api=1&travelmode="+S.mode+"&destination="+ll(dest);if(origin)u+="&origin="+ll(origin);if(via&&via.length)u+="&waypoints="+via.map(ll).join("%7C");return u}

     +'<p class="note">直線距離の合計 約'+fmtKm(pathLen(P))+'</p>'

     +'<p class="info">並べ替えは直線距離でのおおまかな順番です。実際の道順・時間はGoogleマップが案内します。</p>'
     +'<label class="note" style="display:grid;gap:4px">移動手段<select class="sel" data-r="mode"><option value="driving"'+(S.mode==="driving"?" selected":"")+'>車</option><option value="walking"'+(S.mode==="walking"?" selected":"")+'>徒歩</option><option value="bicycling"'+(S.mode==="bicycling"?" selected":"")+'>自転車</option><option value="transit"'+(S.mode==="transit"?" selected":"")+'>電車・バス</option></select></label>';
    if(S.mode==="transit")h+='<p class="note">電車・バスは経由地を使えないため、各スポットの［ナビ］から1件ずつ開いてください。</p>';
    else{let i=0,origin=null;while(i<P.length){const ch=P.slice(i,i+9);h+='<a class="bigbtn" style="margin-top:8px" href="'+navUrl(ch[ch.length-1],ch.slice(0,-1),origin)+'" target="_blank" rel="noopener">'+(P.length>9?(i+1)+"〜"+(i+ch.length)+"件目を":"")+'Googleマップでナビ開始</a>';origin=ch[ch.length-1];i+=ch.length}
      h+='<p class="note">出発地は現在地です（Googleマップが自動で設定します）。</p>'}

const WX_CODE={0:["☀","快晴","sun"],1:["🌤","晴れ","sun"],2:["⛅","晴れ時々くもり","cloud"],3:["☁","くもり","cloud"],45:["🌫","霧","fog"],48:["🌫","霧（着氷）","fog"],51:["🌦","弱い霧雨","rain"],53:["🌦","霧雨","rain"],55:["🌧","強い霧雨","rain"],56:["🌧","着氷性の霧雨","rain"],57:["🌧","着氷性の霧雨","rain"],61:["🌧","小雨","rain"],63:["🌧","雨","rain"],65:["🌧","強い雨","heavy"],66:["🌧","着氷性の雨","rain"],67:["🌧","強い着氷性の雨","heavy"],71:["🌨","小雪","snow"],73:["🌨","雪","snow"],75:["❄","大雪","snow"],77:["🌨","霧雪","snow"],80:["🌦","にわか雨","rain"],81:["🌧","にわか雨","rain"],82:["⛈","激しいにわか雨","heavy"],85:["🌨","にわか雪","snow"],86:["❄","強いにわか雪","snow"],95:["⛈","雷雨","storm"],96:["⛈","雷雨（ひょう）","storm"],99:["⛈","激しい雷雨（ひょう）","storm"]};
const wxCache={};
function getWx(lat,lng){
  const k=lat.toFixed(1)+","+lng.toFixed(1),c=wxCache[k];
  if(c&&Date.now()-c.t<10*60*1000)return c.p;
  const p=fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat.toFixed(3)+"&longitude="+lng.toFixed(3)+"&current=temperature_2m,weather_code,is_day,precipitation,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo")
    .then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const u=j.current||{},d=WX_CODE[u.weather_code]||["🌡","—","cloud"];
      return {icon:(!u.is_day&&d[2]==="sun")?"🌙":d[0],label:d[1],kind:d[2],day:!!u.is_day,temp:Math.round(u.temperature_2m),precip:u.precipitation||0,wind:Math.round(u.wind_speed_10m)}})
    .catch(()=>{delete wxCache[k];return null});
  wxCache[k]={t:Date.now(),p};return p;
}
let wxT=null,wxSeq=0;
function wxUpdate(){
  clearTimeout(wxT);
  wxT=setTimeout(async()=>{
    const chip=$("wxchip");if(!chip)return;
    let z=12,c={lat:34.69,lng:135.5};try{z=map.getZoom();c=map.getCenter()}catch(e){}
    if(z<8){chip.hidden=true;setWxFx(null);return}
    if(!S.wx){chip.hidden=false;chip.className="wxchip off";chip.innerHTML='<b>☂</b><span>天気 OFF</span><em>タップでON</em>';chip.title="";setWxFx(null);return}
    const my=++wxSeq;const w=await getWx(c.lat,c.lng);if(my!==wxSeq)return;
    if(!w){chip.hidden=true;setWxFx(null);return}
    chip.hidden=false;chip.className="wxchip";chip.innerHTML='<b>'+w.icon+'</b><span>'+esc(w.label)+'</span><b>'+w.temp+'℃</b><small>地図の中心付近・いま</small><em class="'+(S.wxfx?'on':'')+'">演出 '+(S.wxfx?'ON':'OFF')+'</em>';
    chip.title="風 "+w.wind+"m/s"+(w.precip>0?"／降水 "+w.precip+"mm":"")+"（Open-Meteo）";
    setWxFx(S.wxfx?w:null);
  },700);
}
function setWxFx(w){
  const th=THEMES.find(x=>x.id===S.ui);
  document.documentElement.classList.toggle("wx-night",!!(w&&!w.day&&!(th&&th.keepmap)));
  let el=$("wx");
  if(!w){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="wx";el.setAttribute("aria-hidden","true");$("map").appendChild(el)}
  const cls=w.kind+(w.day?"":" night");if(el.className===cls)return;el.className=cls;
  let h="";const n={rain:60,heavy:110,storm:110,snow:50}[w.kind]||0;
  for(let i=0;i<n;i++){const snow=w.kind==="snow",d=snow?6+Math.random()*7:.45+Math.random()*.4;
    h+='<i style="left:'+(Math.random()*110-5).toFixed(1)+'%;animation-duration:'+d.toFixed(2)+'s;animation-delay:-'+(Math.random()*d).toFixed(2)+'s;'+(snow?'--s:'+(2+Math.random()*4).toFixed(1)+'px;--dx:'+((Math.random()-.5)*80).toFixed(0)+'px':'opacity:'+(.35+Math.random()*.45).toFixed(2))+'"></i>'}
  el.innerHTML=h;
}
// ---------- 拡張パック（packs/ フォルダのデザインを追加・削除） ----------
let packCat=null;
function installPacks(){
  document.querySelectorAll("style.pack").forEach(x=>x.remove());
  THEMES=BASE_THEMES.slice();
  for(const [id,pk] of Object.entries(S.packs||{})){
    const st=document.createElement("style");st.className="pack";st.dataset.pack=id;st.textContent=pk.css||"";document.head.appendChild(st);
    for(const t of pk.themes||[])THEMES.push({...t,grp:pk.name,pack:id});
  }
}
function loadCatalog(){
  if(!/^https?:/.test(location.protocol)){packCat="local";return}
  packCat="loading";
  fetch("packs/catalog.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{packCat=j}).catch(()=>{packCat="err"}).then(()=>{if(document.querySelector(".packs"))drawSet()});
}
async function addPack(id){
  const pk=(packCat.packs||[]).find(x=>x.id===id);if(!pk)return;
  try{const r=await fetch("packs/"+pk.file,{cache:"no-cache"});if(!r.ok)throw 0;const css=await r.text();
    S.packs[id]={name:pk.name,desc:pk.desc,ver:pk.ver,themes:pk.themes,css};save();installPacks();drawSet();toast("「"+pk.name+"」を追加しました。上のデザインから選べます")}
  catch(e){toast("追加できませんでした（インターネット接続を確認してください）")}
}
function delPack(id){
  const pk=S.packs[id];if(!pk)return;
  if((pk.themes||[]).some(t=>t.id===S.ui))applyTheme("");
  delete S.packs[id];save();installPacks();drawSet();drawAll();toast("「"+pk.name+"」を外しました")
}
// 季節の演出：fx は "snow"、{k:"leaf",n:30,size:[10,20],dur:[8,16]}、またはその配列（重ねがけ）。見た目はパック側のCSS（#fx .種類 i）で決める
function setFx(f){let el=$("fx");if(!f){if(el)el.remove();return}
  const L=(Array.isArray(f)?f:[f]).map(x=>typeof x==="string"?{k:x}:x),key=JSON.stringify(L);
  if(!el){el=document.createElement("div");el.id="fx";el.setAttribute("aria-hidden","true");document.body.appendChild(el)}
  if(el.dataset.key===key)return;el.dataset.key=key;const R=(a,b)=>a+Math.random()*(b-a);
  el.innerHTML=L.map(o=>{const D={snow:{n:40,size:[3,8],dur:[8,18]},petal:{n:24,size:[7,13],dur:[8,18]}}[o.k]||{},n=o.n||D.n||24,sz=o.size||D.size||[8,16],du=o.dur||D.dur||[8,18];let h="";
    for(let i=0;i<n;i++){const d=R(du[0],du[1]);h+='<i style="left:'+R(-3,100).toFixed(1)+'%;--s:'+R(sz[0],sz[1]).toFixed(1)+'px;--dx:'+R(-90,90).toFixed(0)+'px;--r:'+((Math.random()>.5?1:-1)*R(300,720)).toFixed(0)+'deg;--a:'+Math.random().toFixed(3)+';--b:'+Math.random().toFixed(3)+';--c:'+Math.random().toFixed(3)+';animation-duration:'+d.toFixed(2)+'s;animation-delay:-'+R(0,d).toFixed(2)+'s"></i>'}
    return '<div class="fxl '+o.k+'">'+h+'</div>'}).join("")}
// 数字の表示（和のデザインでは漢数字）
function fmtN(n){const th=THEMES.find(x=>x.id===S.ui);if(!(th&&th.kanji))return String(n);
  const D="〇一二三四五六七八九";if(n===0)return "〇";let out="";const u=[["千",1000],["百",100],["十",10]];
  for(const [c,v] of u){const k=Math.floor(n/v);if(k){out+=(k>1?D[k]:"")+c;n%=v}}if(n)out+=D[n];return out}
function applyTheme(id){
  if(id==="paper")id="vintage";
  S.ui=id;if(id)document.documentElement.dataset.ui=id;else delete document.documentElement.dataset.ui;
  const th=THEMES.find(x=>x.id===id);setFx(th&&th.fx);if(typeof wxUpdate==="function"){const e=$("wx");if(e)e.className="";wxUpdate()}
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=THEME_TC[id]||(th&&id?th.c[0]:"#1f8a7a");
  const t=THEMES.find(x=>x.id===id);
  if(t&&t.font&&!document.getElementById("font-"+id)){const l=document.createElement("link");l.id="font-"+id;l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?"+t.font+"&display=swap";document.head.appendChild(l)}
}
let newCat={name:"",icon:"🏷"},catDel=null;
function drawSet(){
  const mo=new Date().getMonth()+1;
  let h='<h3 class="ph" style="margin-top:4px">デザイン</h3>'+[...new Set(THEMES.map(t=>t.grp))].map(g=>'<div class="tgrp">'+g+'</div><div class="themes">'+THEMES.filter(t=>t.grp===g).map(t=>'<button data-ui-set="'+t.id+'" class="'+(t.id===S.ui?'on':'')+'"><span class="sw3">'+t.c.map(c=>'<i style="background:'+c+'"></i>').join("")+(t.months&&t.months.includes(mo)?'<em class="now">今の季節</em>':'')+'</span><span class="tn">'+t.name+'</span><span class="td">'+t.desc+'</span></button>').join("")+'</div>').join("");
  if(packCat===null)loadCatalog();
  {const inst=S.packs||{};const cat=packCat&&packCat.packs?packCat.packs:[];const ids=[...new Set([...cat.map(x=>x.id),...Object.keys(inst)])];
   h+='<h3 class="ph">天気</h3><label class="tog"><input type="checkbox" data-wx="wx"'+(S.wx?' checked':'')+'><span>地図に今の天気を表示（地図の中心付近）</span></label><label class="tog"><input type="checkbox" data-wx="wxfx"'+(S.wxfx?' checked':'')+(S.wx?'':' disabled')+'><span>雨・雪・霧・夜などを地図に演出する</span></label><p class="note" style="margin:2px 0 0">天気データ：Open-Meteo（無料）。10分ごとに更新します。</p>';
   h+='<h3 class="ph">拡張パック</h3><div class="packs">'+(ids.length?ids.map(id=>{const c=cat.find(x=>x.id===id),me=inst[id],pk=c||me;
     const btn=me?(c&&c.ver>me.ver?'<button class="btn on" data-pack-add="'+id+'">更新</button>':'')+'<button class="btn line" data-pack-del="'+id+'">外す</button>':'<button class="btn on" data-pack-add="'+id+'">＋ 追加</button>';
     return '<div class="pack'+(me?' got':'')+'"><div class="pk-sw">'+(pk.themes||[]).map(t=>'<span title="'+esc(t.name)+'">'+t.c.map(x=>'<i style="background:'+x+'"></i>').join("")+'</span>').join("")+'</div><b>'+esc(pk.name)+(me?' <small>追加済み</small>':'')+'</b><p>'+esc(pk.desc||"")+'</p><p class="pk-t">'+(pk.themes||[]).map(t=>esc(t.name)).join("・")+'</p><div class="row2">'+btn+'</div></div>'}).join(""):'')
     +(packCat==="loading"?'<p class="note">拡張パックを確認しています…</p>':packCat==="err"?'<p class="note">拡張パックの一覧を読み込めませんでした（インターネット接続を確認してください）。</p>':packCat==="local"?'<p class="note">拡張パックは、Webで公開したマイスポット（https://～）から追加できます。</p>':'')+'</div>'}
  h+='<h3 class="ph">カテゴリ</h3><ul class="catedit">'+S.cats.map(c=>{const n=S.spots.filter(s=>s.cat===c[0]).length;return '<li><span class="cei">'+ico(c[1])+'</span><span>'+esc(c[0])+' <small class="note">'+n+'件</small></span>'+(S.cats.length>1?'<button data-catdel="'+esc(c[0])+'">'+(catDel===c[0]?(n?'このカテゴリの'+n+'件は「その他」へ — 削除':'もう一度押すと削除'):'削除')+'</button>':'')+'</li>'}).join("")+'</ul>'
   +'<div class="row2"><input class="sel" data-newcat placeholder="新しいカテゴリ名（例：スニーカー）" value="'+esc(newCat.name)+'" style="flex:3"><button class="btn line" data-a="addcat">追加</button></div>'
   +'<div class="emojis">'+EMOJIS.map(e=>'<button data-emoji="'+e+'" class="'+(newCat.icon===e?'on':'')+'" title="'+e+'">'+ico(e)+'</button>').join("")+'</div>';
  h+='<h3 class="ph">データの保存・移動</h3>'
   +'<p class="info">スポットは<b>この端末のブラウザの中だけ</b>に保存されています。どこにも送信されません。ブラウザの「履歴・データの削除」をすると消えるので、ときどき「ファイルに保存」しておくと安心です。</p>'
   +'<div class="row2"><button class="btn" data-a="export">ファイルに保存</button><button class="btn" data-a="import">ファイルから読み込む</button></div>'
   +(location.protocol.startsWith("http")?'<div class="row2"><button class="btn" data-a="link">別の端末に送るリンクを作る</button></div><input class="sel" data-linkout readonly hidden><p class="note">リンクを自分宛てに送り、同じネットワークにつないだ別の端末で開くと、スポットが取り込まれます。</p>':'<p class="note">スマホに移すときは「ファイルに保存」したファイルを送り、スマホ側で「ファイルから読み込む」を使ってください。</p>')
   +'<h3 class="ph">すべて消す</h3><div class="row2"><button class="btn line" data-a="wipe">この端末のスポットをすべて削除</button></div>'
   +'<p class="note" style="margin-top:18px">地図：OpenStreetMap／国土地理院　住所検索：国土地理院（入力した住所の文字だけが送られます）</p>';
  $("pSet").innerHTML=h;
}
$("pSet").addEventListener("click",e=>{
  const wxt=e.target.closest("[data-wx]");if(wxt){S[wxt.dataset.wx]=wxt.checked;save();drawSet();wxUpdate();if(selId)openCard(selId);return}
  const pa=e.target.closest("[data-pack-add]");if(pa){addPack(pa.dataset.packAdd);return}
  const pd=e.target.closest("[data-pack-del]");if(pd){delPack(pd.dataset.packDel);return}
  const t=e.target.closest("[data-ui-set]");if(t){applyTheme(t.dataset.uiSet);save();drawSet();drawAll();if(selId)openCard(selId);toast("デザインを「"+THEMES.find(x=>x.id===S.ui).name+"」にしました");return}
  const em=e.target.closest("[data-emoji]");if(em){newCat.name=document.querySelector("[data-newcat]").value;newCat.icon=em.dataset.emoji;drawSet();return}
  const cd=e.target.closest("[data-catdel]");if(cd){const c=cd.dataset.catdel;if(catDel!==c){catDel=c;drawSet();setTimeout(()=>{if(catDel===c){catDel=null;drawSet()}},4000);return}
    S.cats=S.cats.filter(x=>x[0]!==c);if(!S.cats.some(x=>x[0]==="その他"))S.cats.push(["その他","★"]);S.spots.forEach(s=>{if(s.cat===c)s.cat="その他"});catDel=null;save();drawAll();drawSet();return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="addcat"){const n=document.querySelector("[data-newcat]").value.trim();if(!n){toast("カテゴリ名を入れてください");return}if(S.cats.some(c=>c[0]===n)){toast("同じ名前のカテゴリがあります");return}S.cats.splice(Math.max(0,S.cats.length-1),0,[n,newCat.icon]);newCat={name:"",icon:"🏷"};save();drawSet();drawList();toast("カテゴリ「"+n+"」を追加しました")}
  else if(a==="export"){const blob=new Blob([JSON.stringify({type:"myspot",version:1,saved:new Date().toISOString(),spots:S.spots,cats:S.cats},null,1)],{type:"application/json"});const x=document.createElement("a");const d=new Date();x.href=URL.createObjectURL(blob);x.download="マイスポット_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".json";document.body.appendChild(x);x.click();x.remove()}
  else if(a==="import")$("file").click();
  else if(a==="link"){const out=document.querySelector("[data-linkout]");out.hidden=false;out.value=location.origin+location.pathname+"#sp="+encodeSpots(S.spots);out.select();copyText(out.value);toast("リンクをコピーしました")}
  else if(a==="wipe"){if(!b.dataset.arm){b.dataset.arm=1;b.textContent="本当に消す場合はもう一度押してください";setTimeout(()=>{if(b.isConnected){b.removeAttribute("data-arm");b.textContent="この端末のスポットをすべて削除"}},5000);return}
    S.spots=[];S.route=[];save();drawAll();drawSet();toast("すべて削除しました")}
});
function encodeSpots(list){const s=JSON.stringify(list.map(x=>[x.name,x.cat,x.addr,+(+x.lat).toFixed(6),+(+x.lng).toFixed(6),x.memo||"",x.url||"",x.id,x.went?1:0]));return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decodeSpots(t){return JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/"))))).map(a=>({name:a[0],cat:a[1],addr:a[2],lat:a[3],lng:a[4],memo:a[5],url:a[6],id:a[7],went:!!a[8],t:Date.now()}))}
function merge(list,cats){
  let n=0;for(const s of list){if(!s||!s.name||s.lat==null||s.lng==null)continue;if(!s.id)s.id=newId();const i=S.spots.findIndex(x=>x.id===s.id);if(i>=0)S.spots[i]={...S.spots[i],...s};else{S.spots.push(s);n++}
    if(s.cat&&!S.cats.some(c=>c[0]===s.cat)){const c=(cats||[]).find(c=>c[0]===s.cat);S.cats.splice(Math.max(0,S.cats.length-1),0,[s.cat,c?c[1]:"🏷"])}}
  save();drawAll();return n;
}
$("file").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text());const n=merge(j.spots||j,j.cats);toast("スポットを "+n+"件 取り込みました");fitAll()}catch(err){toast("このファイルは読み込めませんでした")}});

// ---------- 検索（自分のスポット＋地名） ----------
const ctl=L.control({position:"topleft"});
ctl.onAdd=()=>{const d=L.DomUtil.create("div","srch");d.innerHTML='<div class="sbox"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="スポット名・地名・住所で検索" autocomplete="off" enterkeyhint="search" aria-label="検索"><button id="qx" aria-label="検索をクリア">×</button></div><div class="sres" id="sres" role="listbox"></div><button class="wxchip" id="wxchip" hidden aria-live="polite"></button>';L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d};
ctl.addTo(map);L.control.zoom({position:"topleft"}).addTo(map);
let hits=[],hitSel=0,places=null,placeBusy=false,placeT=null,lastQ="";
function doSearch(){
  const raw=$("q").value,q=norm(raw);$("qx").style.visibility=raw?"visible":"hidden";
  if(!q){$("sres").classList.remove("show");return}
  const mine=S.spots.filter(s=>norm(s.name).includes(q)||norm(s.addr).includes(q)||norm(s.cat).includes(q)||norm(s.memo).includes(q)).slice(0,10);
  hits=[...mine.map(s=>({k:"s",s})),...(Array.isArray(places)&&lastQ===raw?places.map(p=>({k:"p",p})):[])];
  let h="",i=0;
  if(mine.length)h+='<div class="sgh">マイスポット</div>'+mine.map(s=>'<button class="hit'+(i===0?' act':'')+'" data-i="'+(i++)+'"><span class="hi">'+catIcon(s.cat)+'</span><span><b>'+esc(s.name)+'</b><small>'+esc(s.cat)+(s.addr?'・'+esc(s.addr):'')+'</small></span></button>').join("");
  h+='<div class="sgh">地名・住所</div>';
  if(placeBusy&&lastQ===raw)h+='<div class="none">検索中…</div>';
  else if(Array.isArray(places)&&lastQ===raw)h+=places.length?places.map(p=>'<button class="hit'+(i===0?' act':'')+'" data-i="'+(i++)+'"><span class="hi">📍</span><span><b>'+esc(p.label)+'</b><small>タップでその場所へ移動</small></span><span class="add" data-addplace="'+(i-1)+'">＋登録</span></button>').join(""):'<div class="none">見つかりませんでした</div>';
  else if(places==="err"&&lastQ===raw)h+='<div class="none">検索できませんでした（インターネット接続を確認）</div>';
  else h+='<div class="none">Enterで地名・住所を検索します</div>';
  hitSel=0;$("sres").innerHTML=h;$("sres").classList.add("show");
  clearTimeout(placeT);if(raw.trim().length>=2&&lastQ!==raw)placeT=setTimeout(()=>runPlace(raw),700);
}
async function runPlace(raw){lastQ=raw;placeBusy=true;places=null;doSearch();try{places=await placeSearch(raw)}catch(e){places="err"}placeBusy=false;if($("q").value===raw)doSearch()}
function goHit(i,add){
  const it=hits[i];if(!it)return;$("sres").classList.remove("show");$("q").blur();
  if(it.k==="s"){map.setView([it.s.lat,it.s.lng],Math.max(map.getZoom(),16));openCard(it.s.id)}
  else{map.setView([it.p.lat,it.p.lng],16);if(add){openForm(null,it.p);form.addr=it.p.label;drawForm()}else{showTmp(it.p);setTimeout(()=>showTmp(null),4000)}}
}
$("q").addEventListener("input",doSearch);
$("q").addEventListener("focus",()=>{if($("q").value)doSearch()});
$("q").addEventListener("keydown",e=>{
  const bs=[...$("sres").querySelectorAll(".hit")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!bs.length)return;hitSel=(hitSel+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle("act",i===hitSel))}
  else if(e.key==="Enter"){e.preventDefault();const raw=$("q").value;if(lastQ!==raw||!Array.isArray(places)){clearTimeout(placeT);runPlace(raw)}else goHit(hitSel)}
  else if(e.key==="Escape"){$("sres").classList.remove("show");$("q").blur()}
});
$("sres").addEventListener("click",e=>{const ad=e.target.closest("[data-addplace]");if(ad){goHit(+ad.dataset.addplace,true);return}const b=e.target.closest(".hit");if(b)goHit(+b.dataset.i)});
$("qx").addEventListener("click",()=>{$("q").value="";doSearch();$("q").focus()});

// ---------- 現在地（ファイルを直接開いたときや https のときに使えます） ----------
let meMk=null;
if(navigator.geolocation&&window.isSecureContext){$("fabLoc").hidden=false;
  const ctlLoc=L.control({position:"topleft"});ctlLoc.onAdd=()=>{const d=L.DomUtil.create("div","leaflet-bar");d.innerHTML='<a href="#" title="現在地" role="button" aria-label="現在地" style="font-size:16px">◎</a>';d.firstChild.onclick=e=>{e.preventDefault();locate()};return d};ctlLoc.addTo(map);
  $("fabLoc").addEventListener("click",locate)}
function locate(){navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(meMk)map.removeLayer(meMk);meMk=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#2f6fd6",fillOpacity:1}).addTo(map);map.setView(ll,16)},()=>toast("現在地を取得できませんでした"),{enableHighAccuracy:true,timeout:10000})}

// ---------- 起動 ----------
function drawAll(){drawList();drawRoute();drawMarkers()}
installPacks();if(!THEMES.some(t=>t.id===S.ui))S.ui="";applyTheme(S.ui);drawAll();drawSet();
try{map.on("moveend",wxUpdate);map.attributionControl&&map.attributionControl.addAttribution('天気 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>')}catch(e){}
$("wxchip").addEventListener("click",()=>{
  if(!S.wx){S.wx=true;S.wxfx=true;toast("天気と演出をONにしました")}
  else if(S.wxfx){S.wxfx=false;toast("演出をOFFにしました（天気の表示は残ります）")}
  else{S.wx=false;toast("天気をOFFにしました。もう一度タップでON")}
  save();wxUpdate();if($("pList").querySelector("[data-wx]"))drawSet();if(selId)openCard(selId)});
wxUpdate();setInterval(()=>{if(!document.hidden)wxUpdate()},10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wxUpdate()});
// 別の端末から送られたリンク（#sp=...）
(()=>{const m=location.hash.match(/sp=([A-Za-z0-9_-]+)/);if(!m)return;try{const n=merge(decodeSpots(m[1]));toast("スポットを "+n+"件 取り込みました");fitAll()}catch(e){toast("リンクを読み込めませんでした")}try{history.replaceState(null,"",location.pathname)}catch(e){}})();
if(S.spots.length)fitAll();
window.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCard();if(picking)endPick()}});
}
</script>
